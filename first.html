<!--
     An example to illustrate an image
-->

<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>Images</title>
</head>

<body>
    <h1>Grocery Checklist</h1>

<form action="">

    <p>

        <input type="checkbox" name="groceries"
               value="milk" checked="checked">
        Milk

        <input type="checkbox" name="groceries"
               value="bread">
        Bread

        <input type="checkbox" name="groceries"
               value="eggs">
        Eggs

    </p>

</form>

</body>

</html>
